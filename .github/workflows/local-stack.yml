name: Local lakehouse

# Separate from the validate workflow, and separate deliberately. That one is generated and stays
# fast; this one builds an image and starts three containers, and a job that takes minutes should not
# sit in front of the checks that take seconds.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:

  local-stack:
    runs-on: ubuntu-26.04
    steps:

      - uses: actions/checkout@v7

      # `run` builds the image and starts RustFS and the catalog before running anything.
      #
      # No check for Docker first. A check that skipped this step on a runner without Docker would
      # leave the job passing with no local-stack test run, so a broken write path could merge with
      # every check passing. With no check, `docker compose run` fails here, and the job fails with
      # Docker's own error.
      - name: Run the suite against the local lakehouse
        working-directory: tests/local-stack
        run: docker compose run --rm spark pytest --run-local-stack

      # The pytest failure names the assertion; it cannot say that RustFS never answered or that the
      # catalog exited on startup. That is only in the containers' own output.
      - name: Stack logs
        if: failure()
        working-directory: tests/local-stack
        run: docker compose logs --no-color --timestamps
